# =============================================================================
# llm-forge — single source of truth for the whole pipeline.
# Every script reads from here so Colab and local stay in sync.
# Change values here, not inside the scripts.
# =============================================================================

model:
  # Small instruct base. Swap for whatever current small model you like.
  # Good learning targets: Qwen2.5-1.5B-Instruct, Llama-3.2-1B-Instruct, SmolLM2-1.7B-Instruct.
  base_id: "Qwen/Qwen2.5-1.5B-Instruct"
  # Where the merged fp16 model lands before GGUF conversion.
  merged_dir: "artifacts/merged-fp16"

data:
  # Chat-template JSONL produced by data/prepare_data.py.
  # Each line: {"messages": [{"role": "...", "content": "..."}, ...]}
  train_path: "data/train.jsonl"
  eval_path: "data/eval.jsonl"
  # Start here to prove the pipeline runs end-to-end before using real data.
  sample_path: "data/sample_dataset.jsonl"

# QLoRA / LoRA hyperparameters. Defaults are sane for a 1–2B model on a T4.
lora:
  r: 16                 # rank — higher = more capacity + more VRAM
  alpha: 32             # scaling; convention is 2x r
  dropout: 0.05
  target_modules:       # attention + MLP projections; names are model-family specific
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

train:
  output_dir: "artifacts/adapter"   # LoRA adapter weights land here
  epochs: 3
  batch_size: 2                     # per-device; T4 is memory-tight
  grad_accum: 8                     # effective batch = batch_size * grad_accum = 16
  lr: 2.0e-4
  max_seq_len: 1024
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 100
  seed: 42

export:
  # q4_k_m = the standard quality/size sweet spot for local inference.
  # Alternatives: q5_k_m (bigger, better), q8_0 (near-lossless, largest).
  quant: "q4_k_m"
  gguf_out: "artifacts/model.gguf"

ollama:
  model_name: "forge-demo"          # what you'll `ollama run`
